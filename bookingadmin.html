<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ระบบจัดการการนัดหมาย ทันตกรรม KPJH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Customizing Tailwind colors and basic styles */
    :root {
      --primary-green: #15803d;
      --primary-green-dark: #106c33;
    }

    .bg-primary-green {
      background-color: var(--primary-green);
    }

    .hover\:bg-primary-green-dark:hover {
      background-color: var(--primary-green-dark);
    }

    .text-primary-green {
      color: var(--primary-green);
    }

    .focus\:ring-primary-green:focus {
      --tw-ring-color: var(--primary-green);
    }

    .focus\:border-primary-green:focus {
      border-color: var(--primary-green);
    }

    .loader {
      border-top-color: var(--primary-green);
      animation: spin 1s linear infinite;
      border: 8px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 60px;
      height: 60px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Adjusted styles for consistency and modern look */
    input[type="text"],
    input[type="date"],
    input[type="time"],
    select {
    padding: 0.6rem 1rem;
    border-radius: 0.45rem;
    border: 1px solid #c7c7c7;
    font-size: 0.875rem;
    }

    button {
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      font-weight: 600;
    }

    .table-header-sortable {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .table-header-sortable .sort-icon {
      margin-left: 4px;
      font-size: 0.75em;
      opacity: 0.5;
      width: 1em;
      text-align: center;
    }

    .table-header-sortable.asc .sort-icon::after {
      content: '▲';
      opacity: 1;
      color: var(--primary-green);
    }

    .table-header-sortable.desc .sort-icon::after {
      content: '▼';
      opacity: 1;
      color: var(--primary-green);
    }

    /* Adjust body to use flex for sidebar and main content */
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #334155;
    }

    /* Styles for status filter buttons */
    .status-filter-btn {
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      background-color: #e2e8f0;
      color: #4a5568;
      border: 1px solid #cbd5e0;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .status-filter-btn:hover {
      background-color: #cbd5e0;
    }

    .status-filter-btn.active {
      background-color: var(--primary-green);
      color: white;
      border-color: var(--primary-green-dark);
      box-shadow: 0 0 0 2px rgba(21, 128, 61, 0.3);
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="w-64 bg-white text-gray-800 shadow-lg p-6 flex flex-col min-h-screen">
    <h2 class="text-2xl font-bold mb-8 text-primary-green">ทันตกรรม KPJH</h2>

    <ul class="space-y-4 flex-1">
      <li>
        <a href="#"
          class="flex items-center p-3 rounded-lg text-white bg-primary-green bg-opacity-10 font-bold transition duration-300">
          <i class="fas fa-tachometer-alt mr-3 text-lg"></i>Dashboard
        </a>
      </li>
      <li>
        <a href="#"
          class="flex items-center p-3 rounded-lg text-gray-600 hover:text-primary-green hover:bg-primary-green hover:bg-opacity-5 font-medium transition duration-300">
          <i class="fas fa-calendar-alt mr-3 text-lg"></i>Booking
        </a>
      </li>
      <li>
        <a href="#"
          class="flex items-center p-3 rounded-lg text-gray-600 hover:text-primary-green hover:bg-primary-green hover:bg-opacity-5 font-medium transition duration-300">
          <i class="fas fa-cog mr-3 text-lg"></i>Setting
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main Content Area (Dashboard View) -->
  <main class="flex-1 bg-gray-100 p-8 flex flex-col">
    <!-- Current Date Display -->
    <div class="mb-6">
      <p class="text-xl font-bold text-gray-700">
        ข้อมูลการนัดหมาย
        <span id="currentDateDisplay" class="text-base font-normal text-gray-500 ml-4"></span>
      </p>
    </div>

    <!-- Filter Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 mb-6 bg-white p-4 rounded-lg shadow-md">
      <div>
        <label for="filterName" class="block text-sm font-medium text-gray-700 mb-0.5">ชื่อ</label>
        <input type="text" id="filterName"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาชื่อ">
      </div>
      <!-- NEW: Service Filter as Dropdown -->
      <div>
        <label for="filterService" class="block text-sm font-medium text-gray-700 mb-0.5">บริการ</label>
        <select id="filterService"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green">
          <option value="">ทั้งหมด</option>
          <!-- Options populated by JS -->
        </select>
      </div>
      <!-- NEW: Location Filter as Dropdown -->
      <div>
        <label for="filterLocation" class="block text-sm font-medium text-gray-700 mb-0.5">สถานที่</label>
        <select id="filterLocation"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green">
          <option value="">ทั้งหมด</option>
          <!-- Options populated by JS -->
        </select>
      </div>
      <div>
        <label for="filterPhoneNumber" class="block text-sm font-medium text-gray-700 mb-0.5">เบอร์โทร</label>
        <input type="text" id="filterPhoneNumber"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาเบอร์โทร">
      </div>

      <!-- Sort Order Dropdown -->
      <div>
        <label for="sortOrder" class="block text-sm font-medium text-gray-700 mb-0.5">เรียงข้อมูล</label>
        <select id="sortOrder"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green">
          <option value="date-today-first">วันที่ (วันนี้ก่อน, ใหม่สุด)</option>
          <option value="date-asc">วันที่ (เก่าสุดไปใหม่สุด)</option>
          <option value="date-desc">วันที่ (ใหม่สุดไปเก่าสุด)</option>
        </select>
      </div>

      <!-- NEW: Clear All Filters Button -->
      <div class="flex items-end"> <!-- Use flex to align button at the bottom -->
         <button id="clearAllFiltersButton"
          class=" px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition duration-300">
          <i class="fas fa-times-circle mr-2"></i>ล้าง</button> 
      </div>
      <!-- END NEW Clear All Filters Button -->

      <!-- Status Filter as Buttons -->
      <div class="col-span-full">
        <label class="block text-sm font-medium text-gray-700 mb-0.5">สถานะ</label>
        <div id="statusFilterButtons" class="flex flex-wrap gap-2">
          <button type="button" class="status-filter-btn rounded-lg" data-status="รอการยืนยัน">รอการยืนยัน</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="ยืนยันแล้ว">ยืนยันแล้ว</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="ยกเลิก">ยกเลิก</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="เสร็จสิ้น">เสร็จสิ้น</button>
        </div>
      </div>
    </div>

    <!-- Table Section -->
    <div id="filteredData" class="overflow-x-auto bg-white rounded-lg shadow-md p-4">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="hidden px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">Line ID</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">ชื่อ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">บริการ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">สถานที่</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">เบอร์โทร</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">อีเมล</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">วันที่</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">เวลา</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">สถานะ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-100">
          <!-- ข้อมูลจะถูกแสดงที่นี่ -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div id="paginationControls" class="flex justify-center items-center mt-6 space-x-2">
      <button id="prevPage"
        class="py-2 px-4 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300">
        <i class="fas fa-chevron-left"></i> ก่อนหน้า
      </button>
      <div id="pageNumbers" class="flex space-x-1">
        <!-- Page numbers go here -->
      </div>
      <button id="nextPage"
        class="py-2 px-4 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300">
        ถัดไป <i class="fas fa-chevron-right"></i>
      </button>
    </div>

  </main>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="loader"></div>
  </div>

  <script>
    const DETAILS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcruPk0O2BBYqgyLPEL_ant8_3QAMbVwX6cQbxZqFSg-6Jf6l4SpuQsvNChXINlgNvyQ/exec';

    let allBookingsData = [];
    let filteredBookingsData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentSortType = 'date-today-first';

    // NEW: Function to parse DD-MM-YYYY to a Date object reliably
    function parseDDMMYYYYToDateObject(dateString) {
        if (!dateString) return new Date('Invalid Date');
        const parts = dateString.split('-'); // e.g., ["06", "01", "2025"]
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10); // Month is 1-based
            const year = parseInt(parts[2], 10);
            // Date constructor: new Date(year, monthIndex, day)
            // monthIndex is 0-based, so subtract 1 from the month part
            return new Date(year, month - 1, day);
        }
        return new Date('Invalid Date'); // Return an invalid date if format is not as expected
    }

    document.addEventListener('DOMContentLoaded', function () {
      const tableBody = document.getElementById('tableBody');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const clearAllFiltersButton = document.getElementById('clearAllFiltersButton'); // NEW
      const sortOrderSelect = document.getElementById('sortOrder');
      const prevPageButton = document.getElementById('prevPage');
      const nextPageButton = document.getElementById('nextPage');
      const pageNumbersContainer = document.getElementById('pageNumbers');
      const currentDateDisplay = document.getElementById('currentDateDisplay');
      const statusFilterButtonsContainer = document.getElementById('statusFilterButtons');

      // Filter input references for instant filtering
      const filterNameInput = document.getElementById('filterName');
      const filterServiceSelect = document.getElementById('filterService'); // NEW
      const filterLocationSelect = document.getElementById('filterLocation'); // NEW
      const filterPhoneNumberInput = document.getElementById('filterPhoneNumber');

      function displayCurrentDate() {
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        currentDateDisplay.textContent = `วันนี้: ${today.toLocaleDateString('th-TH', options)}`;
      }
      displayCurrentDate();


      // --- Data Fetching and Initial Population ---

      async function fetchAllBookings() {
        showLoadingSpinner(true);
        try {
          const response = await fetch(`${DETAILS_SCRIPT_URL}?action=fetchBookings`);
          const data = await response.json();
          if (Array.isArray(data)) {
            allBookingsData = data.map(detail => ({ ...detail, id: detail.idKey }));
            populateFilterDropdowns(); // NEW: Populate service and location dropdowns
            applyAllFiltersAndSort();
          } else {
            console.error('Expected array but got:', data);
            Swal.fire('ข้อผิดพลาด!', 'รูปแบบข้อมูลการนัดหมายไม่ถูกต้อง', 'error');
            allBookingsData = [];
            applyAllFiltersAndSort();
          }
        } catch (error) {
          console.error('Error fetching all bookings:', error);
          Swal.fire('ข้อผิดพลาด!', 'ไม่สามารถดึงข้อมูลการนัดหมายได้', 'error');
          allBookingsData = [];
          applyAllFiltersAndSort();
        } finally {
          showLoadingSpinner(false);
        }
      }

      // NEW: Function to populate Service and Location filter dropdowns
      function populateFilterDropdowns() {
        const services = new Set();
        const locations = new Set();

        allBookingsData.forEach(booking => {
          if (booking.service) services.add(booking.service);
          if (booking.locationservice) locations.add(booking.locationservice);
        });

        // Clear existing options except "ทั้งหมด"
        filterServiceSelect.innerHTML = '<option value="">ทั้งหมด</option>';
        filterLocationSelect.innerHTML = '<option value="">ทั้งหมด</option>';

        // Add unique services
        Array.from(services).sort().forEach(service => {
          const option = document.createElement('option');
          option.value = service;
          option.textContent = service;
          filterServiceSelect.appendChild(option);
        });

        // Add unique locations
        Array.from(locations).sort().forEach(location => {
          const option = document.createElement('option');
          option.value = location;
          option.textContent = location;
          filterLocationSelect.appendChild(option);
        });
      }


      fetchAllBookings();

      // --- Filter, Sort, and Pagination Logic ---

      function applyAllFiltersAndSort() {
        let tempBookings = [...allBookingsData];

        // Read values from all filter inputs/selects
        const filterName = filterNameInput.value.toLowerCase();
        const filterService = filterServiceSelect.value.toLowerCase(); // NEW
        const filterLocation = filterLocationSelect.value.toLowerCase(); // NEW
        const filterPhoneNumber = filterPhoneNumberInput.value.toLowerCase();
        
        const selectedStatusOptions = Array.from(statusFilterButtonsContainer.querySelectorAll('.status-filter-btn.active'))
                                          .map(btn => btn.dataset.status.toLowerCase());
        
        tempBookings = tempBookings.filter(detail => {
          const matchesName = !filterName || (detail.name && detail.name.toLowerCase().includes(filterName));
          const matchesService = !filterService || (detail.service && detail.service.toLowerCase() === filterService); // EXACT match for dropdown
          const matchesLocation = !filterLocation || (detail.locationservice && detail.locationservice.toLowerCase() === filterLocation); // EXACT match for dropdown
          const matchesPhoneNumber = !filterPhoneNumber || (detail.phonenumber && detail.phonenumber.toLowerCase().includes(filterPhoneNumber));
          
          const matchesStatus = selectedStatusOptions.length === 0 || 
                                (detail.status && selectedStatusOptions.includes(detail.status.toLowerCase()));
          
          return matchesName && matchesService && matchesLocation && matchesPhoneNumber && matchesStatus;
        });

        // Sorting using the corrected customDateSort
        tempBookings.sort((a, b) => customDateSort(a, b, currentSortType));

        filteredBookingsData = tempBookings;
        currentPage = 1;
        displayTable(filteredBookingsData);
        renderPaginationControls();
      }

      // MODIFIED: customDateSort function for reliable date parsing and sorting logic
      function customDateSort(a, b, sortType) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // Use the new parsing function for reliable date conversion
        const dateA = parseDDMMYYYYToDateObject(a.date);
        const dateB = parseDDMMYYYYToDateObject(b.date);

        // Handle invalid dates: push invalid dates to the end
        if (isNaN(dateA.getTime()) && isNaN(dateB.getTime())) return 0;
        if (isNaN(dateA.getTime())) return 1; 
        if (isNaN(dateB.getTime())) return -1;

        // Normalize dates to start of day for comparison
        dateA.setHours(0, 0, 0, 0);
        dateB.setHours(0, 0, 0, 0);

        if (sortType === 'date-today-first') {
            const isAToday = dateA.getTime() === today.getTime();
            const isBToday = dateB.getTime() === today.getTime();
            const isAFuture = dateA.getTime() > today.getTime();
            const isBFuture = dateB.getTime() > today.getTime();

            let valA = 0; // Category for Past dates
            let valB = 0; // Category for Past dates

            if (isAToday) valA = 2; // Category for Today's dates
            else if (isAFuture) valA = 1; // Category for Future dates

            if (isBToday) valB = 2; // Category for Today's dates
            else if (isBFuture) valB = 1; // Category for Future dates

            // First, sort by category (Today > Future > Past)
            if (valA !== valB) {
              return valB - valA; // Descending order of category value (2, 1, 0)
            }
            // If they are in the same category, then sort within that category
            if (valA === 2 || valA === 1) { // Both are Today OR both are Future
                return dateA.getTime() - dateB.getTime(); // Sort oldest/soonest first
            } else { // Both are Past (valA === 0)
                return dateB.getTime() - dateA.getTime(); // Sort newest first (closest to today)
            }
        } else if (sortType === 'date-asc') {
            return dateA.getTime() - dateB.getTime(); // Sort oldest to newest
        } else if (sortType === 'date-desc') {
            return dateB.getTime() - dateA.getTime(); // Sort newest to oldest
        }
        return 0; // Default: no change
      }


      function displayTable(dataToDisplay) {
        tableBody.innerHTML = '';

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, dataToDisplay.length);
        const paginatedData = dataToDisplay.slice(startIndex, endIndex);

        if (paginatedData.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-gray-500">ไม่พบข้อมูลการนัดหมายที่ตรงกับเงื่อนไข</td></tr>`;
          return;
        }

        paginatedData.forEach(detail => {
          let disableConfirm = false;
          let disableComplete = false;
          let disableCancel = false;
          let disableReminder = false;

          // Use the reliable parsing function here too for accurate date comparison
          const bookingDate = parseDDMMYYYYToDateObject(detail.date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const isPastDate = isNaN(bookingDate.getTime()) || bookingDate.getTime() < today.getTime();

          switch (detail.status) {
            case 'รอการยืนยัน':
              disableComplete = true;
              break;
            case 'ยืนยันแล้ว':
              disableConfirm = true;
              if (isPastDate) {
                disableReminder = true;
                // Optionally disable complete if it's already a past date and not completed
                // disableComplete = true; // Uncomment if you want to prevent completing old 'confirmed' bookings
              }
              break;
            case 'ยกเลิก':
              disableCancel = true;
              disableConfirm = true;
              disableComplete = true;
              disableReminder = true;
              break;
            case 'เสร็จสิ้น':
              disableConfirm = true;
              disableCancel = true;
              disableComplete = true;
              disableReminder = true;
              break;
          }

          const row = document.createElement('tr');
          row.className = 'border-b border-gray-100 hover:bg-gray-50';
          row.innerHTML = `
            <td class="hidden px-4 py-2">${detail.userlineid || ''}</td>
            <td class="px-4 py-2">${detail.name || ''}</td>
            <td class="px-4 py-2">${detail.service || ''}</td>
            <td class="px-4 py-2">${detail.locationservice || ''}</td>
            <td class="px-4 py-2">${detail.phonenumber || ''}</td>
            <td class="px-4 py-2">${detail.note || ''}</td>
            <td class="px-4 py-2">${detail.date || ''}</td>
            <td class="px-4 py-2">${detail.time || ''}</td>
            <td class="px-4 py-2">
              <span class="px-2 py-1 rounded-full text-xs font-semibold
                ${detail.status === 'ยืนยันแล้ว' ? 'bg-green-100 text-green-800' : ''}
                ${detail.status === 'รอการยืนยัน' ? 'bg-yellow-100 text-yellow-800' : ''}
                ${detail.status === 'ยกเลิก' ? 'bg-red-100 text-red-800' : ''}
                ${detail.status === 'เสร็จสิ้น' ? 'bg-blue-100 text-blue-800' : ''}
              ">${detail.status || ''}</span>
            </td>
            <td class="px-4 py-2 flex flex-wrap gap-2">
              <button class="confirm-btn bg-green-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-green-700 ${disableConfirm ? 'opacity-50 cursor-not-allowed' : ''}" ${disableConfirm ? 'disabled' : ''} data-id="${detail.idKey}">ยืนยัน</button>
              <button class="cancel-btn bg-red-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-red-700 ${disableCancel ? 'opacity-50 cursor-not-allowed' : ''}" ${disableCancel ? 'disabled' : ''} data-id="${detail.idKey}">ยกเลิก</button>
              <button class="complete-btn bg-blue-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-blue-700 ${disableComplete ? 'opacity-50 cursor-not-allowed' : ''}" ${disableComplete ? 'disabled' : ''} data-id="${detail.idKey}">เสร็จสิ้น</button>
              <button class="reminder-btn bg-yellow-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-yellow-700 ${disableReminder ? 'opacity-50 cursor-not-allowed' : ''}" ${disableReminder ? 'disabled' : ''} data-id="${detail.idKey}">แจ้งเตือน</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        attachEventListeners();
      }

      function renderPaginationControls() {
        pageNumbersContainer.innerHTML = '';
        const totalPages = Math.ceil(filteredBookingsData.length / itemsPerPage);

        prevPageButton.disabled = currentPage === 1;
        nextPageButton.disabled = currentPage === totalPages || totalPages === 0;

        if (totalPages <= 1) {
          prevPageButton.classList.add('hidden');
          nextPageButton.classList.add('hidden');
          pageNumbersContainer.classList.add('hidden');
          return;
        } else {
          prevPageButton.classList.remove('hidden');
          nextPageButton.classList.remove('hidden');
          pageNumbersContainer.classList.remove('hidden');
        }

        const maxPagesToShow = 4;

        let startPage = Math.max(1, currentPage - Math.floor((maxPagesToShow -1) / 2));
        let endPage = startPage + maxPagesToShow - 1;

        if (endPage > totalPages) {
            endPage = totalPages;
            startPage = Math.max(1, totalPages - maxPagesToShow + 1);
        }

        if (startPage > 1) {
            addPageButton(1);
            if (startPage > 2) {
                addEllipsis();
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            addPageButton(i);
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                addEllipsis();
            }
            addPageButton(totalPages);
        }
      }

      function addPageButton(pageNumber) {
        const pageButton = document.createElement('button');
        pageButton.textContent = pageNumber;
        pageButton.className = `py-2 px-4 rounded-lg text-sm font-medium transition duration-300 ${currentPage === pageNumber ? 'bg-primary-green text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
        pageButton.addEventListener('click', () => {
          currentPage = pageNumber;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        });
        pageNumbersContainer.appendChild(pageButton);
      }

      function addEllipsis() {
        const span = document.createElement('span');
        span.textContent = '...';
        span.className = 'py-2 px-4 text-gray-500';
        pageNumbersContainer.appendChild(span);
      }


      // --- Event Listeners for Instant Filtering ---

      // Text Inputs
      filterNameInput.addEventListener('input', applyAllFiltersAndSort);
      filterPhoneNumberInput.addEventListener('input', applyAllFiltersAndSort);

      // Dropdowns
      filterServiceSelect.addEventListener('change', applyAllFiltersAndSort); // NEW
      filterLocationSelect.addEventListener('change', applyAllFiltersAndSort); // NEW
      sortOrderSelect.addEventListener('change', () => {
          currentSortType = sortOrderSelect.value;
          applyAllFiltersAndSort();
      });

      // Status Filter Buttons (click handler is already defined)
      statusFilterButtonsContainer.addEventListener('click', (event) => {
          const clickedButton = event.target.closest('.status-filter-btn');
          if (clickedButton) {
              clickedButton.classList.toggle('active');
              applyAllFiltersAndSort();
          }
      });

      // NEW: Clear All Filters Button
      clearAllFiltersButton.addEventListener('click', () => {
        // Clear text inputs
        filterNameInput.value = '';
        filterPhoneNumberInput.value = '';
        
        // Reset dropdowns to "ทั้งหมด"
        filterServiceSelect.value = '';
        filterLocationSelect.value = '';
        sortOrderSelect.value = 'date-today-first'; // Reset sort order to default
        currentSortType = 'date-today-first'; 

        // Deselect all status filter buttons
        document.querySelectorAll('.status-filter-btn').forEach(button => {
            button.classList.remove('active');
        });

        applyAllFiltersAndSort(); // Re-apply all filters
      });


      // Pagination Buttons (existing logic)
      prevPageButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        }
      });

      nextPageButton.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredBookingsData.length / itemsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        }
      });

      // --- Action Button Functions (Confirm, Cancel, Complete, Reminder) ---
      function attachEventListeners() {
        document.querySelectorAll('.confirm-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            confirmBooking(id);
          });
        });

        document.querySelectorAll('.cancel-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            cancelBooking(id);
          });
        });

        document.querySelectorAll('.complete-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            completeBooking(id);
          });
        });

        document.querySelectorAll('.reminder-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            sendReminder(id);
          });
        });
      }

      async function confirmBooking(id) {
        Swal.fire({
          title: 'คุณแน่ใจหรือไม่?',
          text: "คุณต้องการยืนยันการนัดหมายนี้หรือไม่!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, ยืนยันเลย!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=confirmBooking&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ยืนยันแล้ว!', 'การจองได้รับการยืนยันแล้ว.', 'success');
                await fetchAllBookings();
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการยืนยัน: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error confirming booking:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการยืนยันการนัดหมาย.', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

      async function cancelBooking(id) {
        Swal.fire({
          title: 'คุณแน่ใจหรือไม่?',
          text: "คุณต้องการยกเลิกการนัดหมายนี้หรือไม่!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, ยกเลิกเลย!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=cancelBooking&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ยกเลิกแล้ว!', 'การนัดหมายถูกยกเลิกแล้ว.', 'success');
                await fetchAllBookings();
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการยกเลิก: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error canceling booking:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการยกเลิกการนัดหมาย.', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

      async function completeBooking(id) {
        Swal.fire({
          title: 'คุณแน่ใจหรือไม่?',
          text: "คุณต้องการ เสร็จสิ้น การนัดหมายนี้หรือไม่!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, การนัดหมายเสร็จสิ้น!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=completeBooking&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ยืนยันแล้ว!', 'การนัดหมายได้เสร็จสิ้นแล้ว.', 'success');
                await fetchAllBookings();
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการเสร็จสิ้น: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error completing booking:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการ การนัดหมายเสร็จสิ้น .', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

      async function sendReminder(id) {
        Swal.fire({
          title: 'ส่งการเตือนความจำ?',
          text: "การเตือนความจำจะถูกส่งไปยังผู้ใช้.",
          icon: 'info',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, ส่งเลย!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=sendReminder&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ส่งการเตือนสำเร็จ!', 'การเตือนความจำถูกส่งเรียบร้อยแล้ว.', 'success');
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการส่งการเตือนความจำ: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error sending reminder:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการส่งการเตือนความจำ.', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

      function showLoadingSpinner(show) {
        if (show) {
          loadingSpinner.classList.remove('hidden');
        } else {
          loadingSpinner.classList.add('hidden');
        }
      }
    });
  </script>
