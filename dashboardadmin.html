<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ระบบจัดการการนัดหมาย ทันตกรรม KPJH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Font Awesome CDN for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Customizing Tailwind colors and basic styles */
    :root {
      --primary-green: #15803d;
      --primary-green-dark: #106c33;
    }

    .bg-primary-green {
      background-color: var(--primary-green);
    }

    .hover\:bg-primary-green-dark:hover {
      background-color: var(--primary-green-dark);
    }

    .text-primary-green {
      color: var(--primary-green);
    }

    .focus\:ring-primary-green:focus {
      --tw-ring-color: var(--primary-green);
    }

    .focus\:border-primary-green:focus {
      border-color: var(--primary-green);
    }

    .loader {
      border-top-color: var(--primary-green);
      animation: spin 1s linear infinite;
      border: 8px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 60px;
      height: 60px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Adjusted styles for consistency and modern look */
    input[type="text"],
    input[type="date"],
    input[type="time"] {
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid #e2e8f0;
      font-size: 0.875rem;
    }

    button {
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      font-weight: 600;
    }

    .table-header-sortable {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .table-header-sortable .sort-icon {
      margin-left: 4px;
      font-size: 0.75em;
      opacity: 0.5;
      width: 1em;
      text-align: center;
    }

    .table-header-sortable.asc .sort-icon::after {
      content: '▲';
      opacity: 1;
      color: var(--primary-green);
    }

    .table-header-sortable.desc .sort-icon::after {
      content: '▼';
      opacity: 1;
      color: var(--primary-green);
    }

    /* Adjust body to use flex for sidebar and main content */
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #334155;
    }

    /* NEW: Styles for status filter buttons */
    .status-filter-btn {
      padding: 0.5rem 0.75rem; /* Smaller padding for buttons */
      font-size: 0.875rem; /* text-sm */
      background-color: #e2e8f0; /* gray-200 */
      color: #4a5568; /* gray-700 */
      border: 1px solid #cbd5e0; /* gray-300 */
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .status-filter-btn:hover {
      background-color: #cbd5e0; /* gray-300 */
    }

    .status-filter-btn.active {
      background-color: var(--primary-green);
      color: white;
      border-color: var(--primary-green-dark);
      box-shadow: 0 0 0 2px rgba(21, 128, 61, 0.3); /* green-600 with opacity */
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="w-64 bg-white text-gray-800 shadow-lg p-6 flex flex-col min-h-screen">
    <h2 class="text-2xl font-bold mb-8 text-primary-green">ทันตกรรม KPJH</h2>

    <ul class="space-y-4 flex-1">
      <li>
        <a href="dashboardadmin.html"
          class="flex items-center p-3 rounded-lg text-white bg-primary-green bg-opacity-10 font-bold transition duration-300">
          <!-- Active Link -->
          <i class="fas fa-tachometer-alt mr-3 text-lg"></i>Dashboard
        </a>
      </li>
      <li>
        <a href="bookingadmin.html"
          class="flex items-center p-3 rounded-lg text-gray-600 hover:text-primary-green hover:bg-primary-green hover:bg-opacity-5 font-medium transition duration-300">
          <i class="fas fa-calendar-alt mr-3 text-lg"></i>Booking
        </a>
      </li>
      <li>
        <a href="#"
          class="flex items-center p-3 rounded-lg text-gray-600 hover:text-primary-green hover:bg-primary-green hover:bg-opacity-5 font-medium transition duration-300">
          <i class="fas fa-cog mr-3 text-lg"></i>Setting
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main Content Area (Dashboard View) -->
  <main class="flex-1 bg-gray-100 p-8 flex flex-col">
    <!-- Current Date Display -->
    <div class="mb-6">
      <p class="text-xl font-bold text-gray-700">
        ข้อมูลการนัดหมาย
        <span id="currentDateDisplay" class="text-base font-normal text-gray-500 ml-4"></span>
      </p>
    </div>

    <!-- Filter Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-6 bg-white p-6 rounded-lg shadow-md">
      <div>
        <label for="filterName" class="block text-sm font-medium text-gray-700 mb-1">ชื่อ</label>
        <input type="text" id="filterName"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาชื่อ">
      </div>
      <div>
        <label for="filterService" class="block text-sm font-medium text-gray-700 mb-1">บริการ</label>
        <input type="text" id="filterService"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาบริการ">
      </div>
      <div>
        <label for="filterLocation" class="block text-sm font-medium text-gray-700 mb-1">สถานที่</label>
        <input type="text" id="filterLocation"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาสถานที่">
      </div>
      <div>
        <label for="filterPhoneNumber" class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทร</label>
        <input type="text" id="filterPhoneNumber"
          class="w-full p-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
          placeholder="ค้นหาเบอร์โทร">
      </div>
      <!-- NEW: Status Filter as Buttons -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">สถานะ</label>
        <div id="statusFilterButtons" class="flex flex-wrap gap-2">
          <button type="button" class="status-filter-btn rounded-lg" data-status="รอการยืนยัน">รอการยืนยัน</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="ยืนยันแล้ว">ยืนยันแล้ว</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="ยกเลิก">ยกเลิก</button>
          <button type="button" class="status-filter-btn rounded-lg" data-status="เสร็จสิ้น">เสร็จสิ้น</button>
        </div>
      </div>
      <!-- END NEW Status Filter -->
      <div class="col-span-full flex justify-end mt-4">
        <button id="applyFiltersButton"
          class="py-2 px-6 bg-primary-green text-white rounded-lg hover:bg-primary-green-dark transition duration-300">
          <i class="fas fa-filter mr-2"></i>คัดกรองข้อมูล
        </button>
        <button id="resetFiltersButton"
          class="ml-2 py-2 px-6 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition duration-300">
          <i class="fas fa-redo mr-2"></i>รีเซ็ต
        </button>
      </div>
    </div>

    <!-- Table Section -->
    <div id="filteredData" class="overflow-x-auto bg-white rounded-lg shadow-md p-4">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="hidden px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">Line ID</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">ชื่อ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">บริการ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">สถานที่</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">เบอร์โทร</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">หมายเหตุ</th>
            <th id="sortDate"
              class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider table-header-sortable">
              วันที่<span class="sort-icon"></span></th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">เวลา</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">สถานะ</th>
            <th class="px-4 py-3 text-left font-medium text-gray-600 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-100">
          <!-- ข้อมูลจะถูกแสดงที่นี่ -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div id="paginationControls" class="flex justify-center items-center mt-6 space-x-2">
      <button id="prevPage"
        class="py-2 px-4 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300">
        <i class="fas fa-chevron-left"></i> ก่อนหน้า
      </button>
      <div id="pageNumbers" class="flex space-x-1">
        <!-- Page numbers go here -->
      </div>
      <button id="nextPage"
        class="py-2 px-4 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300">
        ถัดไป <i class="fas fa-chevron-right"></i>
      </button>
    </div>

  </main>

  <!-- REMOVED: Modal Popup for adding appointments -->

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="loader"></div>
  </div>

  <script>
    const DETAILS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcruPk0O2BBYqgyLPEL_ant8_3QAMbVwX6cQbxZqFSg-6Jf6l4SpuQsvNChXINlgNvyQ/exec';

    let allBookingsData = [];
    let filteredBookingsData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentSortColumn = 'date';
    let currentSortDirection = 'asc';

    document.addEventListener('DOMContentLoaded', function () {
      const tableBody = document.getElementById('tableBody');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const applyFiltersButton = document.getElementById('applyFiltersButton');
      const resetFiltersButton = document.getElementById('resetFiltersButton');
      const sortDateHeader = document.getElementById('sortDate');
      const prevPageButton = document.getElementById('prevPage');
      const nextPageButton = document.getElementById('nextPage');
      const pageNumbersContainer = document.getElementById('pageNumbers');
      const currentDateDisplay = document.getElementById('currentDateDisplay');
      const statusFilterButtonsContainer = document.getElementById('statusFilterButtons'); // NEW: Reference to button container

      function displayCurrentDate() {
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        currentDateDisplay.textContent = `วันนี้: ${today.toLocaleDateString('th-TH', options)}`;
      }
      displayCurrentDate();


      // --- Data Fetching and Initial Population ---

      async function fetchAllBookings() {
        showLoadingSpinner(true);
        try {
          const response = await fetch(`${DETAILS_SCRIPT_URL}?action=fetchBookings`);
          const data = await response.json();
          if (Array.isArray(data)) {
            allBookingsData = data.map(detail => ({ ...detail, id: detail.idKey }));
            applyAllFiltersAndSort();
          } else {
            console.error('Expected array but got:', data);
            Swal.fire('ข้อผิดพลาด!', 'รูปแบบข้อมูลการนัดหมายไม่ถูกต้อง', 'error');
            allBookingsData = [];
            applyAllFiltersAndSort();
          }
        } catch (error) {
          console.error('Error fetching all bookings:', error);
          Swal.fire('ข้อผิดพลาด!', 'ไม่สามารถดึงข้อมูลการนัดหมายได้', 'error');
          allBookingsData = [];
          applyAllFiltersAndSort();
        } finally {
          showLoadingSpinner(false);
        }
      }

      fetchAllBookings();

      // --- Filter, Sort, and Pagination Logic ---

      function applyAllFiltersAndSort() {
        let tempBookings = [...allBookingsData];

        const filterName = document.getElementById('filterName').value.toLowerCase();
        const filterService = document.getElementById('filterService').value.toLowerCase();
        const filterLocation = document.getElementById('filterLocation').value.toLowerCase();
        const filterPhoneNumber = document.getElementById('filterPhoneNumber').value.toLowerCase();
        
        // NEW: Get selected statuses from active buttons
        const selectedStatusOptions = Array.from(statusFilterButtonsContainer.querySelectorAll('.status-filter-btn.active'))
                                          .map(btn => btn.dataset.status.toLowerCase());
        
        tempBookings = tempBookings.filter(detail => {
          const matchesName = !filterName || (detail.name && detail.name.toLowerCase().includes(filterName));
          const matchesService = !filterService || (detail.service && detail.service.toLowerCase().includes(filterService));
          const matchesLocation = !filterLocation || (detail.locationservice && detail.locationservice.toLowerCase().includes(filterLocation));
          const matchesPhoneNumber = !filterPhoneNumber || (detail.phonenumber && detail.phonenumber.toLowerCase().includes(filterPhoneNumber));
          
          // If no status buttons are active, consider all statuses a match
          // Otherwise, only match if detail.status is in the selected (active) statuses
          const matchesStatus = selectedStatusOptions.length === 0 || 
                                (detail.status && selectedStatusOptions.includes(detail.status.toLowerCase()));
          
          return matchesName && matchesService && matchesLocation && matchesPhoneNumber && matchesStatus;
        });

        tempBookings.sort((a, b) => {
          if (currentSortColumn === 'date') {
            return customDateSort(a, b, currentSortDirection);
          }
          return 0;
        });

        filteredBookingsData = tempBookings;
        currentPage = 1;
        displayTable(filteredBookingsData);
        renderPaginationControls();
      }

      function customDateSort(a, b, direction) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const dateA = new Date(a.date);
        const dateB = new Date(b.date);

        if (isNaN(dateA.getTime()) && isNaN(dateB.getTime())) return 0;
        if (isNaN(dateA.getTime())) return 1; 
        if (isNaN(dateB.getTime())) return -1;

        dateA.setHours(0, 0, 0, 0);
        dateB.setHours(0, 0, 0, 0);

        const isAToday = dateA.getTime() === today.getTime();
        const isBToday = dateB.getTime() === today.getTime();
        const isAFuture = dateA.getTime() > today.getTime();
        const isBFuture = dateB.getTime() > today.getTime();

        let valA = 0;
        let valB = 0;

        if (isAToday) valA = 2;
        else if (isAFuture) valA = 1;
        else valA = 0;

        if (isBToday) valB = 2;
        else if (isBFuture) valB = 1;
        else valB = 0;

        if (valA !== valB) {
          return valB - valA;
        }

        return direction === 'asc' ? dateA.getTime() - dateB.getTime() : dateB.getTime() - dateA.getTime();
      }


      function displayTable(dataToDisplay) {
        tableBody.innerHTML = '';

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, dataToDisplay.length);
        const paginatedData = dataToDisplay.slice(startIndex, endIndex);

        if (paginatedData.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-gray-500">ไม่พบข้อมูลการนัดหมายที่ตรงกับเงื่อนไข</td></tr>`;
          return;
        }

        paginatedData.forEach(detail => {
          let disableConfirm = false;
          let disableComplete = false;
          let disableCancel = false;
          let disableReminder = false;

          const bookingDate = new Date(detail.date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const isPastDate = isNaN(bookingDate.getTime()) || bookingDate.getTime() < today.getTime();

          switch (detail.status) {
            case 'รอการยืนยัน':
              disableComplete = true;
              break;
            case 'ยืนยันแล้ว':
              disableConfirm = true;
              if (isPastDate) {
                disableReminder = true;
              }
              break;
            case 'ยกเลิก':
              disableCancel = true;
              disableConfirm = true;
              disableComplete = true;
              disableReminder = true;
              break;
            case 'เสร็จสิ้น':
              disableConfirm = true;
              disableCancel = true;
              disableComplete = true;
              disableReminder = true;
              break;
          }

          const row = document.createElement('tr');
          row.className = 'border-b border-gray-100 hover:bg-gray-50';
          row.innerHTML = `
            <td class="hidden px-4 py-2">${detail.userlineid || ''}</td>
            <td class="px-4 py-2">${detail.name || ''}</td>
            <td class="px-4 py-2">${detail.service || ''}</td>
            <td class="px-4 py-2">${detail.locationservice || ''}</td>
            <td class="px-4 py-2">${detail.phonenumber || ''}</td>
            <td class="px-4 py-2">${detail.note || ''}</td>
            <td class="px-4 py-2">${detail.date || ''}</td>
            <td class="px-4 py-2">${detail.time || ''}</td>
            <td class="px-4 py-2">
              <span class="px-2 py-1 rounded-full text-xs font-semibold
                ${detail.status === 'ยืนยันแล้ว' ? 'bg-green-100 text-green-800' : ''}
                ${detail.status === 'รอการยืนยัน' ? 'bg-yellow-100 text-yellow-800' : ''}
                ${detail.status === 'ยกเลิก' ? 'bg-red-100 text-red-800' : ''}
                ${detail.status === 'เสร็จสิ้น' ? 'bg-blue-100 text-blue-800' : ''}
              ">${detail.status || ''}</span>
            </td>
            <td class="px-4 py-2 flex flex-wrap gap-2">
              <button class="confirm-btn bg-green-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-green-700 ${disableConfirm ? 'opacity-50 cursor-not-allowed' : ''}" ${disableConfirm ? 'disabled' : ''} data-id="${detail.idKey}">ยืนยัน</button>
              <button class="cancel-btn bg-red-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-red-700 ${disableCancel ? 'opacity-50 cursor-not-allowed' : ''}" ${disableCancel ? 'disabled' : ''} data-id="${detail.idKey}">ยกเลิก</button>
              <button class="complete-btn bg-blue-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-blue-700 ${disableComplete ? 'opacity-50 cursor-not-allowed' : ''}" ${disableComplete ? 'disabled' : ''} data-id="${detail.idKey}">เสร็จสิ้น</button>
              <button class="reminder-btn bg-yellow-600 text-white px-3 py-1 text-xs rounded-lg hover:bg-yellow-700 ${disableReminder ? 'opacity-50 cursor-not-allowed' : ''}" ${disableReminder ? 'disabled' : ''} data-id="${detail.idKey}">แจ้งเตือน</button>
            </td>
          `;
          tableBody.appendChild(row);
        });

        attachEventListeners();
      }

      // Pagination Logic (shows max 4 numbers + ellipsis)
      function renderPaginationControls() {
        pageNumbersContainer.innerHTML = '';
        const totalPages = Math.ceil(filteredBookingsData.length / itemsPerPage);

        prevPageButton.disabled = currentPage === 1;
        nextPageButton.disabled = currentPage === totalPages || totalPages === 0;

        if (totalPages <= 1) {
          prevPageButton.classList.add('hidden');
          nextPageButton.classList.add('hidden');
          pageNumbersContainer.classList.add('hidden');
          return;
        } else {
          prevPageButton.classList.remove('hidden');
          nextPageButton.classList.remove('hidden');
          pageNumbersContainer.classList.remove('hidden');
        }

        const maxPagesToShow = 4;

        let startPage = Math.max(1, currentPage - Math.floor((maxPagesToShow -1) / 2));
        let endPage = startPage + maxPagesToShow - 1;

        if (endPage > totalPages) {
            endPage = totalPages;
            startPage = Math.max(1, totalPages - maxPagesToShow + 1);
        }

        if (startPage > 1) {
            addPageButton(1);
            if (startPage > 2) {
                addEllipsis();
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            addPageButton(i);
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                addEllipsis();
            }
            addPageButton(totalPages);
        }
      }

      function addPageButton(pageNumber) {
        const pageButton = document.createElement('button');
        pageButton.textContent = pageNumber;
        pageButton.className = `py-2 px-4 rounded-lg text-sm font-medium transition duration-300 ${currentPage === pageNumber ? 'bg-primary-green text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
        pageButton.addEventListener('click', () => {
          currentPage = pageNumber;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        });
        pageNumbersContainer.appendChild(pageButton);
      }

      function addEllipsis() {
        const span = document.createElement('span');
        span.textContent = '...';
        span.className = 'py-2 px-4 text-gray-500';
        pageNumbersContainer.appendChild(span);
      }


      // --- Event Listeners ---

      // NEW: Event listener for status filter buttons (using event delegation)
      statusFilterButtonsContainer.addEventListener('click', (event) => {
          const clickedButton = event.target.closest('.status-filter-btn');
          if (clickedButton) {
              clickedButton.classList.toggle('active'); // Toggle 'active' class
              applyAllFiltersAndSort(); // Re-apply all filters
          }
      });

      // Apply Filters Button
      applyFiltersButton.addEventListener('click', applyAllFiltersAndSort);

      // Reset Filters Button
      resetFiltersButton.addEventListener('click', () => {
        document.getElementById('filterName').value = '';
        document.getElementById('filterService').value = '';
        document.getElementById('filterLocation').value = '';
        document.getElementById('filterPhoneNumber').value = '';
        
        // NEW: Deselect all status filter buttons
        document.querySelectorAll('.status-filter-btn').forEach(button => {
            button.classList.remove('active');
        });

        applyAllFiltersAndSort();
      });


      // Sort Header Click
      sortDateHeader.addEventListener('click', () => {
        document.querySelectorAll('.table-header-sortable').forEach(header => {
          header.classList.remove('asc', 'desc');
        });

        if (currentSortColumn === 'date') {
          currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          currentSortColumn = 'date';
          currentSortDirection = 'asc';
        }

        sortDateHeader.classList.add(currentSortDirection);

        applyAllFiltersAndSort();
      });


      // Pagination Buttons
      prevPageButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        }
      });

      nextPageButton.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredBookingsData.length / itemsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          displayTable(filteredBookingsData);
          renderPaginationControls();
        }
      });

      // --- Action Button Functions (Confirm, Cancel, Complete, Reminder) ---
      function attachEventListeners() {
        document.querySelectorAll('.confirm-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            confirmBooking(id);
          });
        });

        document.querySelectorAll('.cancel-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            cancelBooking(id);
          });
        });

        document.querySelectorAll('.complete-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            completeBooking(id);
          });
        });

        document.querySelectorAll('.reminder-btn').forEach(button => {
          button.onclick = null;
          button.addEventListener('click', function () {
            const id = this.dataset.id;
            sendReminder(id);
          });
        });
      }

      async function confirmBooking(id) {
        Swal.fire({
          title: 'คุณแน่ใจหรือไม่?',
          text: "คุณต้องการยืนยันการนัดหมายนี้หรือไม่!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, ยืนยันเลย!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=confirmBooking&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ยืนยันแล้ว!', 'การจองได้รับการยืนยันแล้ว.', 'success');
                await fetchAllBookings();
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการยืนยัน: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error confirming booking:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการยืนยันการนัดหมาย.', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

            } finally {

          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, การนัดหมายเสร็จสิ้น!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {

            } catch (error) {
              console.error('Error completing booking:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการ การนัดหมายเสร็จสิ้น .', 'error');
            } finally {
              showLoadingSpinner(false);

          }

      async function sendReminder(id) {
        Swal.fire({
          title: 'ส่งการเตือนความจำ?',
          text: "การเตือนความจำจะถูกส่งไปยังผู้ใช้.",
          icon: 'info',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'ใช่, ส่งเลย!',
          cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
          if (result.isConfirmed) {
            showLoadingSpinner(true);
            try {
              const response = await fetch(`${DETAILS_SCRIPT_URL}?action=sendReminder&id=${encodeURIComponent(id)}`, { method: 'POST' });
              const data = await response.text();
              if (data.includes("success")) {
                Swal.fire('ส่งการเตือนสำเร็จ!', 'การเตือนความจำถูกส่งเรียบร้อยแล้ว.', 'success');
              } else {
                Swal.fire('ข้อผิดพลาด!', `เกิดข้อผิดพลาดในการส่งการเตือนความจำ: ${data}`, 'error');
              }
            } catch (error) {
              console.error('Error sending reminder:', error);
              Swal.fire('ข้อผิดพลาด!', 'เกิดข้อผิดพลาดในการส่งการเตือนความจำ.', 'error');
            } finally {
              showLoadingSpinner(false);
            }
          }
        });
      }

      function showLoadingSpinner(show) {
        if (show) {
          loadingSpinner.classList.remove('hidden');
        } else {
          loadingSpinner.classList.add('hidden');
        }
      }
    });
  </script>
